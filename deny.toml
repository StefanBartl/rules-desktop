# cargo-deny: what may enter the dependency tree. Run: cargo deny check

[graph]
all-features = false

[advisories]
# Known vulnerabilities and unmaintained crates are errors, in the whole tree: the dependencies that
# come with appkit are transitive.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    # notify (the file watcher) is CC0-1.0, a public domain dedication, and
    # its Linux backend inotify is ISC, a permissive license like MIT.
    "CC0-1.0",
    "ISC",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# An app is built on appkit, never on another app.
deny = [{ crate = "tasks-hub" }, { crate = "hub-testkit" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# appkit, pinned by its tag (tools/check-appkit-pin.py).
allow-git = ["https://github.com/WKDSteve/appkit"]
