# appkit, tasks.nvim, rules.nvim and rules-vault are private repositories. The token of a run
# (github.token) reaches only the repository the run belongs to, so every job that checks one of
# them out, or lets Cargo or pnpm fetch appkit, first calls this step with the secret
# PRIVATE_READ_TOKEN: a fine-grained token, read-only on "Contents" of exactly those repositories
# (how it is made and rotated: docs/RELEASING.md).
#
# It does three things, all for this job only (a runner is thrown away afterwards):
#   - git rewrites https://github.com/<owner>/ to the same address with the token, so a plain
#     `git clone`, Cargo's git source and a `github:` pnpm spec that falls back to git all work
#   - Cargo fetches with the git binary (it honours that rewrite; libgit2 does not always)
#   - pnpm gets the token for codeload.github.com, where it downloads `github:` packages as tarballs
name: private-read
description: Let git, Cargo and pnpm read the private repositories of the owner.
inputs:
  token:
    description: The secret PRIVATE_READ_TOKEN (a composite action cannot read secrets itself).
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PRIVATE_READ_TOKEN: ${{ inputs.token }}
      run: |
        set -eu
        if [ -z "$PRIVATE_READ_TOKEN" ]; then
          echo "::error::the secret PRIVATE_READ_TOKEN is not set: a run cannot read the private repositories without it (docs/RELEASING.md)"
          exit 1
        fi
        echo "::add-mask::$PRIVATE_READ_TOKEN"
        # Both names: the account was renamed, and a Cargo.lock or lock file may still carry the old one.
        for owner in WKDSteve StefanBartl; do
          git config --global "url.https://x-access-token:${PRIVATE_READ_TOKEN}@github.com/${owner}/.insteadOf" "https://github.com/${owner}/"
        done
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
        printf '//codeload.github.com/:_authToken=%s\n' "$PRIVATE_READ_TOKEN" >> "$HOME/.npmrc"
