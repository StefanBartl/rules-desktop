# pnpm downloads appkit-ui (`github:WKDSteve/appkit#<tag>`) as a tarball from codeload.github.com, and appkit is
# private: the download needs a token. On the self-hosted runner the token is the one of `gh` (the author's login on
# this machine); it goes into a config file of this job only (RUNNER_TEMP is thrown away after the job) and is
# handed to pnpm through NPM_CONFIG_USERCONFIG, never into the user's own ~/.npmrc.
# Git needs nothing: `gh auth setup-git` makes it use the same login.
name: pnpm-auth
description: Let pnpm read the private appkit on the self-hosted runner.
runs:
  using: composite
  steps:
    - shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
      run: |
        token="$(gh auth token)"
        test -n "$token"
        echo "::add-mask::$token"
        printf '//codeload.github.com/:_authToken=%s\n' "$token" > "$RUNNER_TEMP/pnpm-auth.npmrc"
        echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/pnpm-auth.npmrc" >> "$GITHUB_ENV"
