# The rolling build: after every green CI run on main, the program of exactly that commit is built for
# Windows and Linux and put on the pre-release `latest`, whose files are replaced each time. It is
# for looking at the newest state with a click, not a release: no version tag, not signed. A release
# stays a deliberate act (release.yml, rule NREL-07).
#
#   rules-hub-windows-x86_64.exe        a double click sets up and starts the hub, and opens the browser
#   rules-hub-linux-x86_64.tar.gz       the same program for Linux (the archive keeps the executable bit)
#   install.ps1, install.sh             install exactly this build for the current user (release-kit
#                                       of appkit, stamped for the channel `latest`)
#   uninstall.ps1, uninstall.sh         the scripts of scripts/ at this commit
#   SHA256SUMS                          the checksums of all of them
#
# Deciding (only the tip of main is built) and publishing (SHA256SUMS first, the words of the page
# last) are the actions prepare and publish of appkit's release-kit, pinned by the commit of the tag
# that Cargo.lock pins (tools/check-appkit-pin.py checks that they agree). The build is ours: its
# files go to publish as artifacts.
#
# Actions are pinned by commit (NREL-03); a job gets only the rights it needs.

name: rolling

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Only the run of the TIP of main may build, and a newer tip replaces a build that is still running: the
# pre-release must end on the newest commit. The group tells the two kinds of run apart before any step runs:
# for a `workflow_run` event `github.sha` is the tip of main when the run started, `head_sha` is the commit the
# CI run was about. A CI run of an OLDER commit that finishes late is not the tip: it lands in a group of its own
# (it builds nothing, `prepare` says so), so it can neither cancel the build of the tip nor push the waiting
# build of the tip out of the queue (a waiting run is replaced by a newer one of the SAME group, even without
# `cancel-in-progress`). The runs that do nothing (a failed CI, a pull request) share that group too.
concurrency:
  group: rolling-${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    # Only a green run that came from a push to main (not a pull request).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      current: ${{ steps.prepare.outputs.current }}
      sha: ${{ steps.prepare.outputs.sha }}
      short: ${{ steps.prepare.outputs.short }}
    steps:
      - id: prepare
        uses: StefanBartl/appkit/release-kit/prepare@ad3fb93c43cc39379c7ca090b0497af6eaafd873 # v0.21.1
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          token: ${{ github.token }}

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.current == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            program: rules-hub.exe
            asset: rules-hub-windows-x86_64.exe
          - os: ubuntu-22.04
            program: rules-hub
            asset: rules-hub-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # The interface is part of the binary (NREL-04): it is built first, then the program.
      - name: Build the interface
        working-directory: ui
        run: |
          npm install --global pnpm@11.28.2
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build the program
        env:
          RULES_HUB_BUILD: ${{ needs.prepare.outputs.short }}
        run: cargo build --release --locked -p rules-hub
      - name: Pack and look at what it says
        env:
          SHORT: ${{ needs.prepare.outputs.short }}
        run: |
          set -eu
          got="$(target/release/${{ matrix.program }} --version)"
          case "$got" in
            *"(build ${SHORT})") ;;
            *) echo "::error::the program says '$got', it should name the build ${SHORT}"; exit 1 ;;
          esac
          mkdir -p dist
          if [ "${{ matrix.program }}" = "rules-hub.exe" ]; then
            cp target/release/rules-hub.exe "dist/${{ matrix.asset }}"
          else
            mkdir -p stage
            cp target/release/rules-hub LICENSE stage/
            COPYFILE_DISABLE=1 tar -czf "dist/${{ matrix.asset }}" -C stage .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rolling-${{ matrix.os }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # The files, the stamped install scripts and the checksums go up in one job; the words of the page
  # move last, so only then does it name this commit.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rolling-*
          path: dist
          merge-multiple: true
      - uses: StefanBartl/appkit/release-kit/publish@ad3fb93c43cc39379c7ca090b0497af6eaafd873 # v0.21.1
        with:
          token: ${{ github.token }}
          tag: latest
          sha: ${{ needs.prepare.outputs.sha }}
          files: dist
          expect: 2
          app: rules-desktop
          windows-kind: hub
          windows-program: rules-hub.exe
          windows-release-asset: rules-hub-{version}-{triple}.zip
          windows-rolling-asset: rules-hub-windows-x86_64.exe
          unix-kind: hub
          unix-program: rules-hub
          unix-release-asset: rules-hub-{version}-{triple}.tar.gz
          unix-rolling-asset: rules-hub-linux-x86_64.tar.gz
          extra: |
            scripts/uninstall.ps1
            scripts/uninstall.sh
          notes-file: .github/rolling-notes.md
